[project]
name = "twinsmith"
version = "0.3.0"
description = "MCP server for Isaac Sim and Isaac Lab with desktop screen capture"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2; python_version < '3.11'",
    # 1.22 is the lowest version tested with current Pydantic 2 releases.
    # Upper bound <2: mcp 2 renamed FastMCP to MCPServer and removed
    # `mcp.server.fastmcp`, which twinsmith/server.py imports.
    # The installed version is the one in uv.lock. `uv sync --locked` and
    # `uv run --locked` use that file. `uv tool install` does not.
    "mcp[cli]>=1.22,<2",
    # Older supported MCP releases do not constrain HTTPX 1.x, whose API breaks them.
    "httpx>=0.27.1,<1",
    # Host-side screen tools (twinsmith/screen.py).
    "mss>=10.0",
    "pillow>=10.1",
    "python-xlib>=0.33",
    "imageio-ffmpeg>=0.5",
]

# What the host tests need (`pip install -e '.[test]'`).
[project.optional-dependencies]
test = [
    "pytest",
    "pyyaml",  # RViz config validity in test_ros2_tools.py
]
scene-test = ["usd-core>=25.11,<27", "numpy", "twinsmith[mesh]"]  # numpy: occupancy-map tests; mesh: the mesh and rule tests
# The synthetic recovery in test_sysid.py; the sysid tool itself runs MuJoCo in its own environment, never here.
sysid-test = ["mujoco[sysid]==4.0.1; python_version >= '3.11'"]
# Isaac Lab tool pack: TensorBoard event-file readout (isaaclab__metrics_*, isaaclab__tensorboard_tail).
isaaclab = [
    "tensorboard>=2.14",
]
# Mesh preparation and validation (assets__mesh, assets__validate): run in a subprocess of this interpreter.
mesh = [
    "trimesh>=4,<5",
    "scipy>=1.11",  # trimesh needs it for convex hulls and oriented boxes
    "coacd==1.0.11",
    "fast-simplification>=0.1.7",
    "usd-core>=25.11,<27",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/kalebcoleman/twinsmith"
Documentation = "https://github.com/kalebcoleman/twinsmith/blob/main/docs/README.md"
Issues = "https://github.com/kalebcoleman/twinsmith/issues"
Releasing = "https://github.com/kalebcoleman/twinsmith/blob/main/docs/RELEASING.md"

# LLM-facing MCP server entry point (the TCP client to the Kit bridge).
# The Kit-side socket server lives in exts/twinsmith.bridge/ and is loaded by Kit, not pip.
[project.scripts]
twinsmith = "twinsmith.server:main"

# Keep this project's resolver independent of the repository-root simulator
# project, which sets prerelease = "allow" and pins the Isaac Sim stack.
# `if-necessary` is uv's default: a pre-release is used only when a requirement
# asks for one. `uv lock` and `uv sync --locked` then match from this directory
# alone and from the repository root.
[tool.uv]
prerelease = "if-necessary"

[build-system]
# Pinned so that a pull request's package check builds what a release publishes. Hatchling 1.33 writes
# Metadata-Version 2.5, which needs twine >= 7 (docs/RELEASING.md); update the pins together.
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twinsmith"]
