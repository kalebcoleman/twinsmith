<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1070" width="1560" height="1070" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/></marker></defs>
<rect width="1560" height="1070" fill="#ffffff"/>
<rect x="560" y="20" width="440" height="70" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="780.0" y="44" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">MCP client</text>
<text x="780.0" y="68" font-size="12.5" text-anchor="middle" fill="#333333">Claude Code, Codex, OpenCode, Claude Desktop, any MCP client</text>
<rect x="1120" y="20" width="400" height="70" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="1320.0" y="44" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Configuration</text>
<text x="1320.0" y="68" font-size="12.5" text-anchor="middle" fill="#333333">MCP client entry, environment variables (docs/ENVIRONMENT.md),</text>
<text x="1320.0" y="87" font-size="12.5" text-anchor="middle" fill="#333333">project file, asset approval config</text>
<rect x="40" y="150" width="1480" height="300" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="54" y="176" font-size="15" font-weight="bold" fill="#222222">twinsmith host server  (mcp/twinsmith; one process per client; needs no simulator).  A client is shown the enabled toolsets' tools, grouped with an action</text>
<rect x="60" y="200" width="220" height="230" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="170.0" y="224" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Gateway</text>
<text x="170.0" y="248" font-size="12.5" text-anchor="middle" fill="#333333">help</text>
<text x="170.0" y="267" font-size="12.5" text-anchor="middle" fill="#333333">refresh_tools</text>
<text x="170.0" y="286" font-size="12.5" text-anchor="middle" fill="#333333">use_bridge</text>
<text x="170.0" y="305" font-size="12.5" text-anchor="middle" fill="#333333"></text>
<text x="170.0" y="324" font-size="12.5" text-anchor="middle" fill="#333333">finds bridges by port</text>
<text x="170.0" y="343" font-size="12.5" text-anchor="middle" fill="#333333">or runtime portfile</text>
<rect x="300" y="200" width="300" height="230" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="450.0" y="224" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Simulator tools (from a catalog)</text>
<text x="450.0" y="248" font-size="12.5" text-anchor="middle" fill="#333333">sim__*  scene, physics, sensors,</text>
<text x="450.0" y="267" font-size="12.5" text-anchor="middle" fill="#333333">  controller runs, replay</text>
<text x="450.0" y="286" font-size="12.5" text-anchor="middle" fill="#333333">assets__*  import, packs</text>
<text x="450.0" y="305" font-size="12.5" text-anchor="middle" fill="#333333">workcell__*  the lab work cell</text>
<text x="450.0" y="324" font-size="12.5" text-anchor="middle" fill="#333333">built-ins: status, run_python,</text>
<text x="450.0" y="343" font-size="12.5" text-anchor="middle" fill="#333333">  job_status, job_cancel, files</text>
<rect x="620" y="200" width="220" height="230" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="730.0" y="224" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Asset broker</text>
<text x="730.0" y="248" font-size="12.5" text-anchor="middle" fill="#333333">approved roots and packs</text>
<text x="730.0" y="267" font-size="12.5" text-anchor="middle" fill="#333333">snapshot into staging</text>
<text x="730.0" y="286" font-size="12.5" text-anchor="middle" fill="#333333">URDF, xacro, SDF, MJCF,</text>
<text x="730.0" y="305" font-size="12.5" text-anchor="middle" fill="#333333">mesh and map conversion</text>
<text x="730.0" y="324" font-size="12.5" text-anchor="middle" fill="#333333">(no code from a file is run)</text>
<rect x="860" y="200" width="220" height="230" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="970.0" y="224" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Isaac Lab and script jobs</text>
<text x="970.0" y="248" font-size="12.5" text-anchor="middle" fill="#333333">isaaclab__*  (toolset: sim)</text>
<text x="970.0" y="267" font-size="12.5" text-anchor="middle" fill="#333333">run_script</text>
<text x="970.0" y="286" font-size="12.5" text-anchor="middle" fill="#333333"></text>
<text x="970.0" y="305" font-size="12.5" text-anchor="middle" fill="#333333">install choice per call,</text>
<text x="970.0" y="324" font-size="12.5" text-anchor="middle" fill="#333333">GPU guards, job folder,</text>
<text x="970.0" y="343" font-size="12.5" text-anchor="middle" fill="#333333">health and progress</text>
<rect x="1100" y="200" width="200" height="230" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="1200.0" y="224" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Desktop and recording</text>
<text x="1200.0" y="248" font-size="12.5" text-anchor="middle" fill="#333333">screenshot</text>
<text x="1200.0" y="267" font-size="12.5" text-anchor="middle" fill="#333333">screen_recording</text>
<text x="1200.0" y="286" font-size="12.5" text-anchor="middle" fill="#333333">join_videos (clips, sheet,</text>
<text x="1200.0" y="305" font-size="12.5" text-anchor="middle" fill="#333333">  frames to MP4)</text>
<text x="1200.0" y="324" font-size="12.5" text-anchor="middle" fill="#333333">window tools;</text>
<text x="1200.0" y="343" font-size="12.5" text-anchor="middle" fill="#333333">computer (toolset: computer)</text>
<rect x="1320" y="200" width="180" height="230" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="1410.0" y="224" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Simulator sessions</text>
<text x="1410.0" y="248" font-size="12.5" text-anchor="middle" fill="#333333">simulators: launch,</text>
<text x="1410.0" y="267" font-size="12.5" text-anchor="middle" fill="#333333">list, status, stop</text>
<text x="1410.0" y="286" font-size="12.5" text-anchor="middle" fill="#333333"></text>
<text x="1410.0" y="305" font-size="12.5" text-anchor="middle" fill="#333333"></text>
<text x="1410.0" y="324" font-size="12.5" text-anchor="middle" fill="#333333"></text>
<text x="1410.0" y="343" font-size="12.5" text-anchor="middle" fill="#333333">toolset computer: never in a</text>
<text x="1410.0" y="362" font-size="12.5" text-anchor="middle" fill="#333333">profile; name it with +computer</text>
<text x="1410.0" y="381" font-size="12.5" text-anchor="middle" fill="#333333">(it starts GPU processes)</text>
<rect x="40" y="600" width="700" height="370" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="54" y="626" font-size="15" font-weight="bold" fill="#222222">Isaac Sim  (one Kit process per simulator; ./run.sh or simulators)</text>
<rect x="60" y="650" width="210" height="150" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="165.0" y="674" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">twinsmith.bridge</text>
<text x="165.0" y="698" font-size="12.5" text-anchor="middle" fill="#333333">TCP server, default :8766</text>
<text x="165.0" y="717" font-size="12.5" text-anchor="middle" fill="#333333">JSON lines with request ids</text>
<text x="165.0" y="736" font-size="12.5" text-anchor="middle" fill="#333333">token; read-only mode</text>
<text x="165.0" y="755" font-size="12.5" text-anchor="middle" fill="#333333">inline, exclusive, in order</text>
<text x="165.0" y="774" font-size="12.5" text-anchor="middle" fill="#333333">jobs, run_python, file tools</text>
<rect x="290" y="650" width="210" height="150" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="395.0" y="674" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">sim-tools</text>
<text x="395.0" y="698" font-size="12.5" text-anchor="middle" fill="#333333">sim.* and assets.* tools</text>
<text x="395.0" y="717" font-size="12.5" text-anchor="middle" fill="#333333">session-layer edits only</text>
<text x="395.0" y="736" font-size="12.5" text-anchor="middle" fill="#333333">exact stepping,</text>
<text x="395.0" y="755" font-size="12.5" text-anchor="middle" fill="#333333">controller runs, replay,</text>
<text x="395.0" y="774" font-size="12.5" text-anchor="middle" fill="#333333">camera and LiDAR capture</text>
<rect x="520" y="650" width="200" height="150" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="620.0" y="674" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">workcell</text>
<text x="620.0" y="698" font-size="12.5" text-anchor="middle" fill="#333333">UR5e work cell tools</text>
<text x="620.0" y="717" font-size="12.5" text-anchor="middle" fill="#333333">(toolset: sim)</text>
<rect x="60" y="820" width="660" height="90" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
<text x="390.0" y="844" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Runtime</text>
<text x="390.0" y="868" font-size="12.5" text-anchor="middle" fill="#333333">USD stage  ·  Newton (target) or PhysX  ·  RTX renderer  ·  bundled ROS 2 bridge</text>
<rect x="780" y="600" width="300" height="150" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="930.0" y="624" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Isaac Lab job processes</text>
<text x="930.0" y="648" font-size="12.5" text-anchor="middle" fill="#333333">train, eval, play, record,</text>
<text x="930.0" y="667" font-size="12.5" text-anchor="middle" fill="#333333">env_check, your own script</text>
<text x="930.0" y="686" font-size="12.5" text-anchor="middle" fill="#333333">each its own process group</text>
<text x="930.0" y="705" font-size="12.5" text-anchor="middle" fill="#333333">(and its own Kit)</text>
<rect x="1120" y="600" width="180" height="150" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
<text x="1210.0" y="624" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Desktop (X11)</text>
<text x="1210.0" y="648" font-size="12.5" text-anchor="middle" fill="#333333">application windows,</text>
<text x="1210.0" y="667" font-size="12.5" text-anchor="middle" fill="#333333">read by window id:</text>
<text x="1210.0" y="686" font-size="12.5" text-anchor="middle" fill="#333333">works covered or locked</text>
<rect x="800" y="800" width="280" height="130" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
<text x="940.0" y="824" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">ROS 2 clients (optional)</text>
<text x="940.0" y="848" font-size="12.5" text-anchor="middle" fill="#333333">RViz 2, Nav2, your ROS nodes</text>
<text x="940.0" y="867" font-size="12.5" text-anchor="middle" fill="#333333">/clock, /tf, /joint_states</text>
<text x="940.0" y="886" font-size="12.5" text-anchor="middle" fill="#333333">Cyclone DDS on loopback</text>
<text x="940.0" y="905" font-size="12.5" text-anchor="middle" fill="#333333">(config/ros_dds.env)</text>
<rect x="1120" y="800" width="400" height="240" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="1320.0" y="824" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">Files on this machine</text>
<text x="1320.0" y="848" font-size="12.5" text-anchor="middle" fill="#333333">asset root and packs  (TWINSMITH_ASSET_ROOT)</text>
<text x="1320.0" y="867" font-size="12.5" text-anchor="middle" fill="#333333">staging  (~/.cache/twinsmith/staging)</text>
<text x="1320.0" y="886" font-size="12.5" text-anchor="middle" fill="#333333">scene output: captures, frames, CSV logs</text>
<text x="1320.0" y="905" font-size="12.5" text-anchor="middle" fill="#333333">  (TWINSMITH_SCENE_OUTPUT)</text>
<text x="1320.0" y="924" font-size="12.5" text-anchor="middle" fill="#333333">jobs folder: one record per job, Lab or simulator</text>
<text x="1320.0" y="943" font-size="12.5" text-anchor="middle" fill="#333333">  (TWINSMITH_JOBS_DIR)</text>
<text x="1320.0" y="962" font-size="12.5" text-anchor="middle" fill="#333333">~/Pictures/twinsmith, ~/Videos/twinsmith</text>
<text x="1320.0" y="981" font-size="12.5" text-anchor="middle" fill="#333333">session records, server log, help-gaps.jsonl</text>
<rect x="40" y="982" width="1040" height="62" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="560.0" y="1006" font-size="14" font-weight="bold" text-anchor="middle" fill="#222222">A tool call takes one of three routes: answered by the host itself, forwarded to the selected bridge, or run as a job process.</text>
<text x="560.0" y="1030" font-size="12.5" text-anchor="middle" fill="#333333">Grouped tools run single-purpose tools behind them; each still answers to its own name.</text>
<path d="M 780 90 L 780 150" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="613" y="110" width="333" height="19" fill="#ffffff" opacity="0.95"/>
<text x="780" y="124" font-size="12" text-anchor="middle" fill="#111111" font-style="italic">MCP over stdio (JSON-RPC): tools/list, tools/call</text>
<path d="M 120 430 L 120 650" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="59" y="550" width="122" height="19" fill="#ffffff" opacity="0.95"/>
<text x="120" y="564" font-size="12" text-anchor="middle" fill="#111111" font-style="italic">status, discovery</text>
<path d="M 375 430 L 375 500 L 220 500 L 220 650" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="174" y="490" width="248" height="19" fill="#ffffff" opacity="0.95"/>
<text x="298" y="504" font-size="12" text-anchor="middle" fill="#111111" font-style="italic">JSON lines over TCP, loopback, token</text>
<path d="M 1410 430 L 1410 475 L 700 475 L 700 600" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="453" y="465" width="215" height="19" fill="#ffffff" opacity="0.95"/>
<text x="560" y="479" font-size="12" text-anchor="middle" fill="#111111" font-style="italic">starts run.sh, checks readiness</text>
<path d="M 730 430 L 730 545 L 1420 545 L 1420 800" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1265" y="535" width="261" height="19" fill="#ffffff" opacity="0.95"/>
<text x="1395" y="549" font-size="12" text-anchor="middle" fill="#111111" font-style="italic">reads approved files, writes snapshots</text>
<path d="M 970 430 L 970 600" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="886" y="565" width="168" height="19" fill="#ffffff" opacity="0.95"/>
<text x="970" y="579" font-size="12" text-anchor="middle" fill="#111111" font-style="italic">starts, watches, cancels</text>
<path d="M 1200 430 L 1200 600" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1139" y="500" width="122" height="19" fill="#ffffff" opacity="0.95"/>
<text x="1200" y="514" font-size="12" text-anchor="middle" fill="#111111" font-style="italic">pixels, placement</text>
<path d="M 1040 750 L 1040 775 L 1160 775 L 1160 800" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1012" y="765" width="175" height="19" fill="#ffffff" opacity="0.95"/>
<text x="1100" y="779" font-size="12" text-anchor="middle" fill="#111111" font-style="italic">logs, checkpoints, videos</text>
<path d="M 740 950 L 1120 950" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="780" y="940" width="300" height="19" fill="#ffffff" opacity="0.95"/>
<text x="930" y="954" font-size="12" text-anchor="middle" fill="#111111" font-style="italic">reads staging; writes output and job records</text>
<path d="M 720 865 L 800 865" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="745" y="855" width="30" height="19" fill="#ffffff" opacity="0.95"/>
<text x="760" y="869" font-size="12" text-anchor="middle" fill="#111111" font-style="italic">DDS</text>
</svg>
