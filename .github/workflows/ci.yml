name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-checks:
    name: CPU-only host checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Check documentation
        run: python3 scripts/check_docs.py

      - name: Check for old names
        run: python3 scripts/check_names.py --enforce

      - name: Check bundled asset licences
        run: python3 scripts/check_assets.py

      - name: Check for hard-coded user paths
        run: python3 scripts/check_portable_paths.py

      - name: Check packaged UR5e catalog
        run: python3 scripts/gen_host_catalog.py --check

      - name: Check simulator lockfile
        run: uv lock --check

      - name: Check host lockfile
        working-directory: mcp
        run: uv lock --check

      - name: Run host test suite (Python 3.12)
        working-directory: mcp
        run: uv run --locked --isolated --python 3.12 --extra test --extra isaaclab --extra scene-test pytest -q

      # --no-project is required. mcp/uv.lock pins a newer SDK; this job must
      # still import against the stated floor, mcp==1.22.0.
      - name: Check minimum supported MCP SDK
        working-directory: mcp
        run: uv run --no-project --python 3.12 --with-editable '.[test,isaaclab]' --with 'mcp[cli]==1.22.0' pytest -q tests/test_packaging.py tests/test_toolsets.py tests/test_desktop_input.py tests/test_sim_sessions.py tests/test_screen_windows.py tests/test_check_docs.py tests/test_host_catalog_gateway.py tests/test_scene_gateway.py tests/test_project_assets.py tests/test_host_lock.py tests/test_cu_*.py

  # The release build without a tag: sdist and wheel, version, `twine check`, a clean install.
  # It never publishes; only release.yml does, on a v<version> tag.
  package:
    name: Package build and metadata
    uses: ./.github/workflows/build-dist.yml
